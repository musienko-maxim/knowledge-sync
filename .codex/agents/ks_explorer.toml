name = "ks_explorer"
description = "Read-only investigation of knowledge-sync task scope, code paths, interfaces, and existing tests."
sandbox_mode = "read-only"
developer_instructions = """
Read AGENTS.md, docs/SESSION_HANDOFF.md, docs/AGENT_WORKFLOW.md, and the exact assigned task file.
Trace only the assigned behavior. Load ks-persistence or ks-youtube-auth when relevant.
